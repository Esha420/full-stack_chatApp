apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-blue
  namespace: chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      version: blue
  template:
    metadata:
      labels:
        app: frontend
        version: blue
    spec:
      containers:
      - name: frontend
        image: esha420/chatapp-frontend:v1
        ports:
        - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-green
  namespace: chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      version: green
  template:
    metadata:
      labels:
        app: frontend
        version: green
    spec:
      containers:
      - name: frontend
        image: esha420/chatapp-frontend:v2  # new version
        ports:
        - containerPort: 80
